<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Background gradient: deep navy to dark royal red/purple -->
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a0818"/>
      <stop offset="60%" stop-color="#12040c"/>
      <stop offset="100%" stop-color="#070205"/>
    </radialGradient>
    <!-- Gold shimmer gradient for text -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff099"/>
      <stop offset="35%" stop-color="#f5a623"/>
      <stop offset="75%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#ffe066"/>
    </linearGradient>
    <!-- Ruby red accent gradient -->
    <linearGradient id="ruby" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4b72"/>
      <stop offset="60%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
    <!-- Outer ring gradient -->
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="50%" stop-color="#f5a623"/>
      <stop offset="100%" stop-color="#c47f0d"/>
    </linearGradient>
    <!-- Inner glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Drop shadow for text -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#f5a623" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Circular background -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>

  <!-- Outer gold ring -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="url(#ring)" stroke-width="8"/>

  <!-- Inner ruby ring -->
  <circle cx="256" cy="256" r="222" fill="none" stroke="url(#ruby)" stroke-width="2.5" stroke-opacity="0.8"/>

  <!-- Decorative corner stars / diamonds -->
  <polygon points="256,26 264,46 256,42 248,46" fill="#f5a623" opacity="0.9"/>
  <polygon points="256,486 264,466 256,470 248,466" fill="#f5a623" opacity="0.9"/>
  <polygon points="26,256 46,248 42,256 46,264" fill="#f5a623" opacity="0.9"/>
  <polygon points="486,256 466,248 470,256 466,264" fill="#f5a623" opacity="0.9"/>

  <!-- 4-point decorative diamonds -->
  <g fill="#f5a623" opacity="0.6">
    <polygon points="85,85 92,97 85,91 78,97"/>
    <polygon points="427,85 434,97 427,91 420,97"/>
    <polygon points="85,427 92,415 85,421 78,415"/>
    <polygon points="427,427 434,415 427,421 420,415"/>
  </g>

  <!-- Glowing center badge -->
  <circle cx="256" cy="256" r="172" fill="#180710" fill-opacity="0.9" stroke="#e11d48" stroke-width="1.5"/>

  <!-- Top label -->
  <text
    x="256"
    y="185"
    font-family="'Arial', sans-serif"
    font-size="20"
    font-weight="700"
    text-anchor="middle"
    fill="#f5a623"
    fill-opacity="0.9"
    letter-spacing="6"
  >OFFICIAL</text>

  <!-- 3RR main text -->
  <text
    x="256"
    y="295"
    font-family="'Arial Black', 'Arial', sans-serif"
    font-size="128"
    font-weight="900"
    text-anchor="middle"
    fill="url(#gold)"
    filter="url(#shadow)"
    letter-spacing="-2"
  >3RR</text>

  <!-- Tagline text -->
  <text
    x="256"
    y="348"
    font-family="'Arial', sans-serif"
    font-size="22"
    font-weight="700"
    text-anchor="middle"
    fill="#fda4af"
    letter-spacing="8"
  >GAME PAKISTAN</text>

  <!-- Small decorative line under tagline -->
  <line x1="160" y1="362" x2="352" y2="362" stroke="#f5a623" stroke-width="2" stroke-opacity="0.6"/>

</svg>