<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0d1a3a"/>
      <stop offset="70%" stop-color="#060e22"/>
      <stop offset="100%" stop-color="#020610"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff099"/>
      <stop offset="30%" stop-color="#f5a623"/>
      <stop offset="70%" stop-color="#e08a00"/>
      <stop offset="100%" stop-color="#ffdf59"/>
    </linearGradient>
    <linearGradient id="royal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6c63ff"/>
      <stop offset="50%" stop-color="#3b28cc"/>
      <stop offset="100%" stop-color="#1a0f66"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffdf59"/>
      <stop offset="50%" stop-color="#f5a623"/>
      <stop offset="100%" stop-color="#995c00"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <rect width="500" height="500" x="6" y="6" rx="94" fill="none" stroke="url(#ring)" stroke-width="4" opacity="0.8"/>
  <circle cx="256" cy="256" r="215" fill="none" stroke="url(#ring)" stroke-width="2" stroke-dasharray="8 6" opacity="0.4"/>

  <!-- Center Badge -->
  <circle cx="256" cy="256" r="185" fill="#0a1230" stroke="url(#gold)" stroke-width="3" filter="url(#shadow)"/>
  <circle cx="256" cy="256" r="170" fill="url(#bg)"/>

  <!-- Top Crown / Star -->
  <g transform="translate(256, 130)">
    <polygon points="0,-18 5,-5 18,-5 8,4 12,17 0,9 -12,17 -8,4 -18,-5 -5,-5" fill="url(#gold)"/>
    <circle cx="-35" cy="0" r="4" fill="url(#gold)"/>
    <circle cx="35" cy="0" r="4" fill="url(#gold)"/>
  </g>

  <!-- Subtitle TOP -->
  <text x="256" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#ffb703" letter-spacing="4">OFFICIAL APK</text>

  <!-- Main IC777 Text -->
  <text x="256" y="285" font-family="'Impact', system-ui, sans-serif" font-size="110" font-weight="900" text-anchor="middle" fill="url(#gold)" filter="url(#shadow)" letter-spacing="2">IC777</text>

  <!-- Subtitle Bottom -->
  <rect x="146" y="310" width="220" height="28" rx="14" fill="url(#royal)" filter="url(#shadow)"/>
  <text x="256" y="329" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#ffffff" letter-spacing="2">GAME PAKISTAN</text>

  <!-- Bottom Details -->
  <text x="256" y="375" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#7a8ab0" letter-spacing="2">SLOTS • TEEN PATTI • WINGO</text>
  <text x="256" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#2ec4b6" letter-spacing="1">⚡ INSTANT JAZZCASH &amp; EASYPAISA</text>
</svg>